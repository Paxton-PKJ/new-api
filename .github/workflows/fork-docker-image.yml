# fork-only deployment workflow, exclude from upstream PR.
#
# Builds the linux/amd64 image from this fork and pushes it to GHCR at
# ghcr.io/<owner>/new-api, tagged with the short commit SHA and fork-latest.
# When DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repository secrets exist on this
# fork, the same image is also pushed to Docker Hub. Upstream docker-build.yml
# is deliberately left untouched; do not include this file in an upstream PR.

name: Fork Docker image (linux/amd64)

on:
  push:
    branches: ['feat/token-model-mapping']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: false
        default: 'feat/token-model-mapping'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: Build & push (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve image name and version
        id: meta
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          SHA=$(git rev-parse --short HEAD)
          echo "ghcr=ghcr.io/${OWNER}/new-api" >> "$GITHUB_OUTPUT"
          echo "version=fork-${SHA}" >> "$GITHUB_OUTPUT"
          echo "fork-${SHA}" > VERSION
          echo "Building ${GITHUB_SHA} as fork-${SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push to GHCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ghcr }}:fork-latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=fork-amd64
          cache-to: type=gha,mode=max,scope=fork-amd64

      - name: Build & push to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/new-api:${{ steps.meta.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/new-api:fork-latest
          cache-from: type=gha,scope=fork-amd64

      - name: Image summary
        run: |
          {
            echo "### Fork image (linux/amd64)"
            echo
            echo "| Registry | Pull with |"
            echo "| --- | --- |"
            echo "| GHCR | \`${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.version }}\` |"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              echo "| Docker Hub | \`${DOCKERHUB_USERNAME}/new-api:${{ steps.meta.outputs.version }}\` |"
            fi
            echo
            echo "Moving tag: \`fork-latest\` · commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
